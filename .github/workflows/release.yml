name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'trottomv/django-never-cache'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install build dependencies
        run: |
          python -m pip install -U pip build twine

      - name: Build package
        run: |
          python -m build
          twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.repository == 'trottomv/django-never-cache'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (trusted publishing + attestation)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
